name: One-time Swift visual density pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swift-visual-density-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage visual system
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')

          if 'EditorialVisualLedger' not in s:
              s = s.replace('import Link from "next/link";\n', 'import Link from "next/link";\nimport { EditorialVisualLedger } from "@/components/EditorialVisualLedger";\n', 1)

          old = "background-image:url('https://cdn.shopify.com/s/files/1/0844/6889/1926/files/blog-36-10.jpg?v=1766750493')"
          new = "background-image:url('https://media.easy-peasy.ai/e47f4f76-4282-464f-98fe-bbb76bda5222/5aa34bd5-6e7e-4c07-9468-d64b0b21709b.png')"
          s = s.replace(old, new)

          anchor = '        <section className="lower-grid">'
          if '<EditorialVisualLedger />' not in s:
              s = s.replace(anchor, '        <EditorialVisualLedger />\n\n' + anchor, 1)

          p.write_text(s, encoding='utf-8')
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/swift-visual-density-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/EditorialVisualLedger.tsx .github/workflows/swift-visual-density-pass.yml
          git commit -m "Add private-market imagery across Swift interior sections"
          git push
