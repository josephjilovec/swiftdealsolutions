name: One-time Swift package type fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-swift-package-types.yml'

permissions:
  contents: write

jobs:
  fix-package-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add explicit featured flags
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          essential = '    href: "/submit?mode=privacy&service=essential"\n  },'
          bespoke = '    href: "/submit?mode=privacy&service=bespoke"\n  }'
          if essential not in text or bespoke not in text:
              raise SystemExit('Expected package definitions not found; refusing to patch')
          text = text.replace(essential, '    href: "/submit?mode=privacy&service=essential",\n    featured: false\n  },', 1)
          text = text.replace(bespoke, '    href: "/submit?mode=privacy&service=bespoke",\n    featured: false\n  }', 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove one-time workflow and commit fix
        run: |
          rm .github/workflows/fix-swift-package-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-swift-package-types.yml
          git commit -m "Fix Swift package card typing for production build"
          git push
